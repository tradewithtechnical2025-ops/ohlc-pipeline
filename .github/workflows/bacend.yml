name: OHLC Pipeline Scans (Manual)

# Manual trigger only — runs any of pipeline.py's scan/report modes on
# demand (VCP, Minervini Trend Template, Weinstein, Box Finder, EP, HLR, status, etc.)
# without needing a separate .yml per mode.
# Option values must be the exact pipeline.py mode names (no spaces).
# public_alerts*: EOD summaries to the public Telegram group (@twt_alerts).
#   public_alerts_dryrun = messages in the log only, public_alerts_ping = one test message per topic.
# backfill_missing: fills missing OHLC in the R2 chunks (history now from Finedge, adjusted).
#   With "symbols" (e.g. INFY,TCS or a BSE code) -> only those stocks.
#   With "symbols" empty -> auto-detects stocks that are missing, have short history,
#   or miss a day in the last 30 market sessions.
# finedge_hist_test: prints what Finedge history returns for "symbols" (e.g. VEDL,ITC,532305)
#   and compares it with the R2 data — writes nothing.
# concall_fetch: the week's concall transcript PDFs -> zip, downloadable as the "concall-inbox" artifact.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pipeline.py mode to run'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - backfill_missing
          - finedge_hist_test
          - concall_fetch
          - vcp_scan
          - minervini_scan
          - stage2_scan
          - weinstein_scan
          - weinstein_scan_dryrun
          - box_scan_dryrun
          - box_scan
          - ep_scan
          - hlr_scan
          - pattern_scan
          - pattern_scan_force
          - candle_scan
          - candle_scan_force
          - home_ticker
          - public_alerts_dryrun
          - public_alerts
          - public_alerts_ping
          - user_alerts_dryrun
          - user_alerts
      symbols:
        description: 'backfill_missing / finedge_hist_test: comma-separated symbols (e.g. INFY,TCS). concall_fetch: days back (max 7). Empty = default.'
        required: false
        default: ''
        type: string

jobs:
  pipeline-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx numpy requests

      - name: Run pipeline.py (${{ inputs.mode }})
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          WORKER_URL:   ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          FINEDGE_TOKEN: ${{ secrets.FINEDGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
          MODE: ${{ inputs.mode }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          case "$MODE" in
            backfill_missing|finedge_hist_test|concall_fetch) python pipeline.py "$MODE" "$SYMBOLS" ;;
            *) python pipeline.py "$MODE" ;;
          esac

      - name: Upload concall inbox
        if: ${{ inputs.mode == 'concall_fetch' }}
        uses: actions/upload-artifact@v4
        with:
          name: concall-inbox
          path: concall_inbox_*.zip
          retention-days: 30
