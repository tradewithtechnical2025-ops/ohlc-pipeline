name: VWAP Backfill (one-time)
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Years of daily VWAP to fill from NSE bhavcopy (resumable: re-run to continue)'
        type: string
        default: '5'
env:
  PYTHONUNBUFFERED: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install httpx requests pillow   # same as NSE Pipeline (backfill imports pipeline_nse.py)
      - name: Run VWAP backfill
        env:
          WORKER_URL:     ${{ secrets.WORKER_URL }}
          WORKER_TOKEN:   ${{ secrets.WORKER_TOKEN }}
          BACKFILL_YEARS: ${{ inputs.years }}
        run: python backfill_vwap.py
