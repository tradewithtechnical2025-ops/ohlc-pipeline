name: Chartink Scanner Pipeline

on:
  schedule:
    # Runs every 3 minutes between 09:00–15:35 IST (03:30–10:05 UTC), Mon–Fri.
    # Adjust to match how often you actually want this to run — every-3-min
    # is aggressive; consider 5/15 min if Chartink starts rate-limiting you.
    - cron: '*/3 3-10 * * 1-5'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml gspread oauth2client pytz

      - name: Write Google service account credentials
        run: echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" > credentials.json

      - name: Run Chartink scanner pipeline
        run: python chartink_pipeline.py

      - name: Clean up credentials
        if: always()
        run: rm -f credentials.json
