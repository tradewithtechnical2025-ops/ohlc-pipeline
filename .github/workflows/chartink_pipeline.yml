name: Chartink Scanner Pipeline

on:
  
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Using a heredoc with a quoted delimiter preserves the secret exactly as
      # stored — no shell expansion, no backslash mangling. Plain `echo "$SECRET"`
      # can corrupt JSON containing \n escapes inside the private_key field.
      - name: Write Google service account credentials
        env:
          CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          cat > credentials.json << 'CREDS_EOF'
          ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          CREDS_EOF

      # Safe diagnostics: reports only structure/validity, never any values.
      - name: Validate credentials file (no values printed)
        run: |
          python - << 'PYEOF'
          import json, sys
          raw = open('credentials.json', 'rb').read()
          print(f"File size: {len(raw)} bytes")
          print(f"Starts with '{{': {raw.lstrip()[:1] == b'{'}")
          print(f"Ends with '}}': {raw.rstrip()[-1:] == b'}'}")
          # Detect curly/smart quotes, the usual copy-paste culprit
          for name, seq in [("left smart quote", b'\xe2\x80\x9c'),
                            ("right smart quote", b'\xe2\x80\x9d')]:
              if seq in raw:
                  print(f"WARNING: found {name} — secret was corrupted on paste")
          try:
              data = json.loads(raw)
              print("JSON is VALID")
              print("Keys present:", sorted(data.keys()))
          except Exception as e:
              print("JSON is INVALID:", e)
              sys.exit(1)
          PYEOF

      - name: Run Chartink scanner pipeline
        run: python chartink_pipeline.py

      - name: Clean up credentials
        if: always()
        run: rm -f credentials.json
