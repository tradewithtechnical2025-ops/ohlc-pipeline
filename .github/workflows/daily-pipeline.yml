name: TradeWithTech Pipeline
on:
  workflow_dispatch:
concurrency:
  group: twt-pipeline
  cancel-in-progress: false
env:
  PYTHON_VERSION: "3.11"
  UPSTOX_TOKEN:       ${{ secrets.UPSTOX_TOKEN }}
  WORKER_URL:         ${{ secrets.WORKER_URL }}
  WORKER_TOKEN:       ${{ secrets.WORKER_TOKEN }}
  FINEDGE_TOKEN:      ${{ secrets.FINEDGE_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Dependencies
        run: |
          pip install httpx requests
      - name: Classification
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline_classification.py classification
      - name: Daily OHLC
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py daily
      - name: Today OHLC
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py today
      - name: 75-min OHLC
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline_75min.py daily
      - name: HLR Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py hlr_scan
      - name: HTF Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python htf_test_scan.py --r2-key htf_test_results.json
      - name: Shakeout Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python shakeout_scanner.py --r2-key shakeout_signals.json
      # ─── Pattern Scan moved AFTER Shakeout Scan (and HTF Scan) so that
      # screener_feed.json's ema_shakeout_map / shakeout_pause_* fields and
      # htf_map are built from TODAY's signals, not yesterday's. Pattern
      # Scan is what builds screener_feed.json — everything it reads from
      # R2 needs to already be fresh by the time it runs. ───
      - name: Pattern Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py pattern_scan
      - name: VCP Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py vcp_scan
      - name: Candlestick Pattern Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py candle_scan

      - name: EP Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py ep_scan
      - name: Minervini Trend Template Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py minervini_scan
      - name: Weinstein Stage Analysis Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py weinstein_scan
      - name: Indices Pipeline
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline_indices.py
      - name: Telegram fallback on workflow failure
        if: failure()
        run: |
          MSG="❌ <b>📊 TradeWithTech Pipeline</b>%0AStatus : <code>WORKFLOW FAILURE</code>%0ATime : $(TZ='Asia/Kolkata' date '+%d %b %Y, %I:%M %p IST')%0A🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=${MSG}"
