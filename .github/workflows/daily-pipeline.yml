name: TradeWithTech Pipeline
on:
  workflow_dispatch:
concurrency:
  group: twt-pipeline
  cancel-in-progress: false
env:
  PYTHON_VERSION: "3.11"
  UPSTOX_TOKEN:       ${{ secrets.UPSTOX_TOKEN }}
  WORKER_URL:         ${{ secrets.WORKER_URL }}
  WORKER_TOKEN:       ${{ secrets.WORKER_TOKEN }}
  FINEDGE_TOKEN:      ${{ secrets.FINEDGE_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Dependencies
        run: |
          pip install httpx requests numpy
      - name: Classification
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline_classification.py classification
      - name: Daily OHLC
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py daily
      - name: Today OHLC
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py today
      - name: 75-min OHLC
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline_75min.py daily
      - name: HLR Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py hlr_scan
      - name: HTF Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python htf_test_scan.py --r2-key htf_test_results.json
      - name: Shakeout Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python shakeout_scanner.py --r2-key shakeout_signals.json
      # Pattern Scan runs after HTF and Shakeout to use today's signals.
      - name: Pattern Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py pattern_scan
      - name: VCP Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py vcp_scan
      - name: Candlestick Pattern Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py candle_scan
      # Minervini, Weinstein and Box Finder read only OHLC; they run before EP Scan so
      # screener_feed (built in EP Scan) gets today's stage / box breakouts for its events.
      - name: Minervini Trend Template Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py minervini_scan
      - name: Weinstein Stage Analysis Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py weinstein_scan
      - name: Box Finder Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py box_scan
      - name: EP Scan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py ep_scan
      # EOD summaries to the public Telegram group; reads screener_feed.json from EP Scan.
      # A failure here must not fail the workflow.
      - name: Public Telegram Alerts
        continue-on-error: true
        run: python pipeline.py public_alerts
      # Personal price / line alerts of users who connected Telegram (Worker + D1).
      - name: User Telegram Alerts
        continue-on-error: true
        run: python pipeline.py user_alerts
      # Preset alerts: the screener's own filters run in a headless browser signed in as the bot account
      # (Pro, verified email). Needs secrets TWT_BOT_EMAIL / TWT_BOT_PASSWORD. Must not fail the workflow.
      - name: Preset Telegram Alerts
        continue-on-error: true
        timeout-minutes: 10
        env:
          TWT_BOT_EMAIL:    ${{ secrets.TWT_BOT_EMAIL }}
          TWT_BOT_PASSWORD: ${{ secrets.TWT_BOT_PASSWORD }}
        run: |
          pip install playwright
          python pipeline.py preset_alerts
      # Home ticker reads scan outputs; keep after the scans.
      - name: Home Page Ticker
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline.py home_ticker
      - name: Indices Pipeline
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python pipeline_indices.py
      - name: Telegram fallback on workflow failure
        if: failure()
        run: |
          MSG="❌ <b>📊 TradeWithTech Pipeline</b>%0AStatus : <code>WORKFLOW FAILURE</code>%0ATime : $(TZ='Asia/Kolkata' date '+%d %b %Y, %I:%M %p IST')%0A🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=${MSG}"
