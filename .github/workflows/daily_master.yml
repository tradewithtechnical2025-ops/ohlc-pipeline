name: Daily Fundamentals Master

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 16:30 IST, Monday–Friday (holidays skipped inside the script)
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Optional comma-separated symbols (e.g. ITC,TCS). Blank = full universe.'
        required: false
        default: ''
      force:
        description: 'Run even on a weekend/holiday'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-fundamentals-master
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx
      - name: Build fundamentals_master.json
        env:
          FINEDGE_TOKEN: ${{ secrets.FINEDGE_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          REQUESTED_SYMBOLS: ${{ inputs.symbols }}
          FORCE_RUN: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ -n "$REQUESTED_SYMBOLS" ]; then ARGS="$ARGS --symbols $REQUESTED_SYMBOLS"; fi
          if [ "$FORCE_RUN" = "true" ]; then ARGS="$ARGS --force"; fi
          python pipeline_daily_master.py $ARGS
