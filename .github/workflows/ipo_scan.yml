name: IPO Scan

on:
     
  workflow_dispatch:

jobs:
  ipo-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install httpx pdfplumber
      - name: Run IPO scan
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          WORKER_URL:   ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: python pipeline_ipo.py

      - name: Run RHP summary pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORKER_URL:     ${{ secrets.WORKER_URL }}
          WORKER_TOKEN:   ${{ secrets.WORKER_TOKEN }}
        run: python pipeline_rhp_summary.py

      - name: Commit updated RHP manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rhp_manifest.json
          git diff --staged --quiet || git commit -m "Update RHP summary manifest"
          git push
