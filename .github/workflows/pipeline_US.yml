name: US Stocks Pipeline (Tiingo OHLC + NASDAQ Meta)

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 3:00 AM IST — daily OHLC update (Tiingo)
    - cron: "45 21 * * 1-5"   # 3:15 AM IST — daily sector/industry/market cap (NASDAQ)
  workflow_dispatch:
    inputs:
      mode:
        description: "Which function to run"
        required: true
        default: "daily"
        type: choice
        options:
          - backfill   # pipeline_us.py --mode backfill (Tiingo, last 3 years OHLC)
          - daily      # pipeline_us.py --mode daily (Tiingo, latest bar append)
          - meta       # pipeline_us_meta.py (NASDAQ sector/industry/market cap)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx

      - name: Determine mode
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 21 * * 1-5" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 21 * * 1-5" ]; then
            echo "mode=meta" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Tiingo OHLC pipeline (backfill or daily)
        if: steps.pick.outputs.mode == 'backfill' || steps.pick.outputs.mode == 'daily'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: python pipeline_us.py --mode ${{ steps.pick.outputs.mode }}

      - name: Run NASDAQ meta pipeline (sector/industry/market cap)
        if: steps.pick.outputs.mode == 'meta'
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: python pipeline_us_meta.py
