name: Test Weinstein Stage Detector

on:
  push:
    paths:
      - 'pipeline_weinstein_test.py'
      - '.github/workflows/test-weinstein-stage.yml'
  pull_request:
    paths:
      - 'pipeline_weinstein_test.py'
      - '.github/workflows/test-weinstein-stage.yml'
  workflow_dispatch:
    inputs:
      run_real_save:
        description: 'Type YES to run the UPDATED test pipeline and write Weinstein output files to R2'
        required: false
        default: ''
        type: string
      debug_symbol:
        description: 'Stock symbol to debug (e.g. BBOX); leave blank for dry-run or save'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run simplified Weinstein detector tests
        run: |
          python - <<'PYTEST'
          import ast
          from pathlib import Path
          source = Path('pipeline_weinstein_test.py')
          tree = ast.parse(source.read_text())
          names = {'_calc_ema', '_weinstein_weekly_records'}
          nodes = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name in names]
          assert len(nodes) == 2, 'Required detector functions missing'
          ns = {}
          exec(compile(ast.fix_missing_locations(ast.Module(body=nodes, type_ignores=[])), str(source), 'exec'), ns)
          def run(closes):
              return ns['_weinstein_weekly_records'](
                  [x * 1.005 for x in closes], [x * 0.995 for x in closes],
                  closes, [1000000] * len(closes))
          up = [100 * 1.012**i for i in range(110)]
          down = [300 * 0.988**i for i in range(110)]
          assert run(up)[-1]['stage'] == 2
          assert run(down)[-1]['stage'] == 4
          assert all(r['stage'] is None for r in run([100] * 90))
          assert run(up[:25])[-1]['stage'] is None
          assert run(up + [up[-1] * 0.99] * 8)[-1]['stage'] == 2
          assert run(down + [down[-1] * 1.01] * 8)[-1]['stage'] == 4
          print('PASS: simplified Weinstein regression checks')
          PYTEST

  dry_run_real_data:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_real_save != 'YES' && github.event.inputs.debug_symbol == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install httpx
          fi
      - name: Run updated Weinstein dry-run (no R2 writes)
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          FINEDGE_TOKEN: ${{ secrets.FINEDGE_TOKEN }}
        run: python pipeline_weinstein_test.py weinstein_scan_dryrun

  run_real_save:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_real_save == 'YES' && github.event.inputs.debug_symbol == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install httpx
          fi
      - name: Run updated Weinstein scan (WRITES R2)
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          FINEDGE_TOKEN: ${{ secrets.FINEDGE_TOKEN }}
        run: python pipeline_weinstein_test.py weinstein_scan

  debug_symbol:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.debug_symbol != '' && github.event.inputs.run_real_save != 'YES'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install httpx
          fi
      - name: Debug symbol (weekly close / EMA30 / slope / stage; no R2 writes)
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          FINEDGE_TOKEN: ${{ secrets.FINEDGE_TOKEN }}
          DEBUG_SYMBOL: ${{ github.event.inputs.debug_symbol }}
        run: python pipeline_weinstein_test.py weinstein_debug "$DEBUG_SYMBOL"
